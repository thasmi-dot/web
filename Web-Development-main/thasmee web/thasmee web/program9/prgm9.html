<html>
<head>
<title>Form Validation</title>
</head>
<body>
<h1>Form Validation</h1>
<form name="form" action="" onsubmit="return validateform()">
<label for ="name:">Name</label>
<select name="init" id="init">
          <option value="mr">MR</option>
          <option value="MRS">MRS</option>
  </select><input type="text" id="name" name="fname" placeholder="Enter your name"><br><br>
<label for="phone:">Phone</label>
  <select>
       <option value="+91">+91</option>
       <option value="+0485">0485</option>
    </select>
    <input type="tel" id="mob" name="mob" placeholder="Enter phone"><br><br>
    <label>Email<input type="Email:"  name="email" id="email" placeholder="email"></label></fieldset><br><br>
    <button type="submit">Submit</button>
    </form>
    <script>
    function validateform()
    {
     var fname=document.form.fname.value.trim();
     var mob=document.form.mob.value.trim();
     var email=document.form.email.value.trim();
     if (fname=="")
     {
       alert("enter your name");
       document.form.fname.focus();
       return false;
       }
       else if(!/^[a-zA-Z]+$/.test(fname)){
       alert("enter Valid name");
       document.form.fname.focus();
       return false;
       }
       if(mob == "")
       {
       alert("enter phone number");
       document.form.mob.focus();
       return false;
       }
       else if(!/^[0-9]{10}$/.test(mob)){
       alert("enter a  valid 10 digit mobile number");
       document.form.mob.focus();
       return false;
       }
       if (email=="")
       {
       alert("enter email");
       document.form.email.focus();
       return false;
       }
       else if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
       alert("enter your email");
       document.form.email.focus();
       return false;
       }
       alert("submitted sucessfully");
       return true;
       }
       </script>
    </body>
    </html>
